name: Publish

# Publishes to the VS Code Marketplace when you push a version tag (e.g. v0.0.1).
# Authentication uses Marketplace Trusted Publishing (GitHub OIDC), so no PAT
# secret is needed. Create a Trusted Publishing policy for the publisher:
#   Marketplace > Manage publishers > ManassehZhou > Trusted Publishing
#   owner=ManassehZhou repo=sliver-vscode workflow=publish.yml
#
#   git tag v0.0.1 && git push origin v0.0.1

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: pnpm run check

      - name: Package VSIX
        run: pnpm run vsix

      - name: Publish to VS Code Marketplace
        run: pnpm exec vsce publish --no-dependencies --packagePath sliver-vscode.vsix --oidc

      - name: Attach VSIX to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: sliver-vscode.vsix
